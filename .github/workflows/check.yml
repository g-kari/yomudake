name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Install pinned test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Check notebook desktop and mobile
        run: pnpm run test:browser
      - name: Retain synthetic notebook screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: notebook-browser-${{ github.sha }}
          path: .sites-runtime/browser/
          # This path contains only synthetic screenshots and result JSON.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
