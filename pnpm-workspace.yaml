packages:
  - '.'

# The direct alpha and Wrangler's beta Miniflare pin undici exactly.
# Apply upstream's 7.x fixes without changing either intended workerd version.
overrides:
  'miniflare@5.20261006.1-alpha>undici': '7.30.2'
  'miniflare@5.20261104.0-beta>undici': '7.30.2'

# Only the existing native tooling may run dependency lifecycle scripts.
allowBuilds:
  esbuild: true
  fsevents: true
  workerd: true
