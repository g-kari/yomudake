packages:
  - '.'

# Miniflare's alpha release pins the vulnerable transitive dependency exactly.
# Keep the runtime/tooling version unchanged while applying upstream's 7.x fixes.
overrides:
  'miniflare@5.20261006.1-alpha>undici': '7.30.2'

# Only the existing native tooling may run dependency lifecycle scripts.
allowBuilds:
  esbuild: true
  fsevents: true
  workerd: true
